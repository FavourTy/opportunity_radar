name: Opportunity Radar

on:
  schedule:
    - cron: "17 6 * * *"    # 07:17 Lagos time
    - cron: "17 17 * * *"   # 18:17 Lagos time
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency: radar

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Collect, score, send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar.py
      - name: Save results for the dashboard
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/items.json
          git diff --cached --quiet || git commit -m "Radar update $(date -u +%F_%H%M)"
          git push
